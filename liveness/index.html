<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./liveness.css" />
  </head>
  <body>
    <div id="liveness"></div>
    <p id="msg"></p>
    <p id="err"></p>
    <button id="start">start</button>
    <button id="retry">retry</button>
    <script type="module">
      import Liveness from "./js/index.js";
      const config = {
        fingerCount: {
          enabled: true,
          expected: 5,
        },
        blink: {
          enabled: true,
          expected: 2,
        },
        speech: {
          enabled: true,
          expected: "Hat",
        },
        movement: {
          enabled: true,
        },
      };
      let livenessSDK = new Liveness(config);
      livenessSDK.onLoaded = () => {
        document.getElementById("msg").innerText =
          "Liveness SDK loaded successfully";
      };

      livenessSDK.onCompleted = () => {
        document.getElementById("msg").innerText =
          "Liveness completed successfully";
      };

      livenessSDK.onError = (error) => {
        document.getElementById("err").innerText = error.message;
      };

      livenessSDK.onFileProcessed = (videoFile) => {
        console.log("File processed:", videoFile);
        document.getElementById("msg").innerText =
          "Video file processed successfully.";
        downloadFile(videoFile, "liveness_video.webm");
      };

      livenessSDK.init();
      document.querySelector("#start").addEventListener("click", () => {
        livenessSDK.startLiveness();
      });

      document.querySelector("#retry").addEventListener("click", () => {
        livenessSDK.retry();
        livenessSDK.startLiveness();
      });

      function downloadFile(file, customFilename) {
        const url = URL.createObjectURL(file);
        const a = document.createElement("a");
        a.href = url;
        a.download = customFilename || file.name; // Use custom name or original filename
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }
    </script>
  </body>
</html>
